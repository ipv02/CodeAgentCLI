[project]
name = "code-agent-cli"
version = "0.1.0"
description = "Standalone terminal coding assistant based on the LLMRequest agent prompt."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "certifi>=2024.8.30",
    "mcp>=1.27,<2",
]

[project.scripts]
agent = "code_agent_cli.main:main"
scheduler-runner = "code_agent_cli.scheduler_runner:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["code_agent_cli*"]

[tool.setuptools.package-data]
code_agent_cli = ["support_data/*.json", "support_data/*.md"]
